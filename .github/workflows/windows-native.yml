name: Windows native acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/windows-native.yml'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements-lock.txt'
      - 'apps/web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell
    env:
      QTRADES_POWERSHELL: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test requirements
        run: python -m pip install --no-input -r requirements-lock.txt
      - name: Verify Windows PowerShell and isolated native behavior
        run: |
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSEdition -ne 'Desktop') { throw 'Requires Windows PowerShell 5.1' }
          python -B -m pytest -q -p no:cacheprovider --tb=long `
            tests/test_simple_update.py tests/test_simple_health.py tests/test_paper_update_shutdown.py `
            tests/test_windows_supervision.py tests/test_paper_engine.py `
            tests/test_paper_risk.py tests/test_paper_risk_store.py `
            tests/test_paper_economics.py tests/test_economics_store.py `
            tests/test_paper_runtime.py tests/test_api.py tests/test_station.py tests/test_paper_store.py `
            tests/test_paper_campaigns.py tests/test_campaign_store.py `
            tests/test_experiment_registry.py tests/test_numerical_candidates.py `
            tests/test_research_campaigns.py tests/test_paper_learning.py `
            tests/test_lab_resilience.py tests/test_live_readiness.py tests/test_efficiency_contracts.py `
            tests/test_research_evidence.py tests/test_pattern_memory.py tests/test_execution_replay.py `
            tests/test_memory_quality.py tests/test_context_flow.py tests/test_incremental_memory.py `
            tests/test_portfolio_components.py tests/test_integrated_research.py `
            tests/test_research_audit_corrections.py tests/test_memory_accounts.py `
            tests/test_autonomous_lab.py tests/test_continuous_safety.py tests/test_research_storage.py `
            tests/test_continuous_audit.py tests/test_trade_history.py tests/test_scoped_tools.py `
            tests/test_role_worker.py tests/test_local_roles.py tests/test_role_history.py `
            tests/test_question_recovery.py tests/test_research_lessons.py tests/test_role_supervisor.py
      - name: Install pinned dashboard dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check and build dashboard
        working-directory: apps/web
        run: npm run build
