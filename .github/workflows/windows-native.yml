name: Windows native acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/windows-native.yml'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements-lock.txt'
      - 'apps/web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell
    env:
      QTRADES_POWERSHELL: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test requirements
        run: python -m pip install --no-input -r requirements-lock.txt
      - name: Verify Windows PowerShell and isolated native behavior
        run: |
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSEdition -ne 'Desktop') { throw 'Requires Windows PowerShell 5.1' }
          python -B -m pytest -q -p no:cacheprovider --tb=long --durations=20 `
            --deselect=tests/test_scoped_tools.py::test_physical_journal_pressure_archives_before_64_mib `
            --deselect=tests/test_scoped_tools.py::test_more_than_5000_receipts_reopen_failures_and_stable_request_ids `
            tests/test_simple_health.py tests/test_paper_update_shutdown.py `
            tests/test_windows_supervision.py tests/test_paper_engine.py `
            tests/test_redesign_strategy.py tests/test_account_redesign.py `
            tests/test_paper_risk.py tests/test_paper_risk_store.py `
            tests/test_paper_economics.py tests/test_economics_store.py `
            tests/test_paper_runtime.py tests/test_api.py tests/test_station.py tests/test_paper_store.py `
            tests/test_paper_campaigns.py tests/test_campaign_store.py `
            tests/test_paper_diagnostics.py tests/test_performance_diagnostic_api.py `
            tests/test_performance_diagnostic_inputs.py tests/test_performance_diagnostic_replay.py `
            tests/test_performance_diagnostic_threads.py tests/test_performance_research_exclusion.py `
            tests/test_experiment_registry.py tests/test_numerical_candidates.py `
            tests/test_research_campaigns.py tests/test_paper_learning.py `
            tests/test_lab_resilience.py tests/test_live_readiness.py tests/test_efficiency_contracts.py `
            tests/test_research_evidence.py tests/test_pattern_memory.py tests/test_execution_replay.py `
            tests/test_memory_quality.py tests/test_context_flow.py tests/test_incremental_memory.py `
            tests/test_execution_window.py tests/test_streaming.py `
            tests/test_engine_diagnostics.py tests/test_admission_recovery_candidate.py `
            tests/test_admission_evaluation_receipts.py tests/test_admission_financial_semantics.py `
            tests/test_coexistence_observer.py `
            tests/test_portfolio_components.py tests/test_integrated_research.py `
            tests/test_research_audit_corrections.py tests/test_memory_accounts.py `
            tests/test_autonomous_lab.py tests/test_continuous_safety.py tests/test_research_storage.py `
            tests/test_research_storage_expansion.py tests/test_research_storage_file_accounting.py tests/test_capture_recovery.py `
            tests/test_trade_history.py tests/test_scoped_tools.py `
            tests/test_activity_reader_recovery.py tests/test_capture_projection.py tests/test_paper_projection.py `
            tests/test_projection_ram.py `
            tests/test_financial_readback.py `
            tests/test_financial_readback_worker.py `
            tests/test_cpu_topology.py `
            tests/test_llm_training.py tests/test_training_workflow.py `
            tests/test_role_worker.py tests/test_local_roles.py tests/test_role_history.py `
            tests/test_role_capability_contract.py tests/test_role_tool_requests.py `
            tests/test_role_tool_transport.py `
            tests/test_role_question_selection.py tests/test_role_question_selection_history.py `
            tests/test_peft_question_selection.py `
            tests/test_paper_pilot_worker.py tests/test_paper_pilot_api.py tests/test_peft_paper_pilot.py `
            tests/test_paper_pilot_lifecycle.py `
            tests/test_role_readiness.py tests/test_peft_development.py tests/test_peft_loader_contract.py `
            tests/test_development_failure_receipts.py tests/test_development_latency_measurement.py `
            tests/test_peft_child_owner.py tests/test_peft_child_resource_integration.py `
            tests/test_request_counts.py `
            tests/test_research_notices.py `
            tests/test_question_recovery.py tests/test_research_lessons.py tests/test_role_supervisor.py `
            tests/test_rule_component.py tests/test_role_packet_preflight.py `
            tests/test_stock_research.py tests/test_research_actors.py `
            tests/test_research_acceptance.py

  native-research-recovery:
    # Retain the measured slow research checks on Windows without extending
    # the required native job's complete eight-minute lifecycle budget.
    runs-on: windows-2025
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell
    env:
      QTRADES_POWERSHELL: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test requirements
        run: python -m pip install --no-input -r requirements-lock.txt
      - name: Verify research contention, diagnosis and continuous audit
        run: |
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSEdition -ne 'Desktop') { throw 'Requires Windows PowerShell 5.1' }
          python -B -m pytest -q -p no:cacheprovider --tb=long --durations=20 `
            tests/test_notice_contention.py tests/test_strategy_diagnosis.py tests/test_continuous_audit.py

  windows-dashboard:
    # Keep the independent dashboard build out of the native suite's complete
    # eight-minute lifecycle, including its checkout/install and final cleanup.
    runs-on: windows-2025
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned dashboard dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check and build dashboard
        working-directory: apps/web
        run: npm run build

  runtime-ownership:
    # Independent ownership and updater checks share this existing Windows job.
    # Preserve every selector and both eight-minute lifecycle budgets.
    runs-on: windows-2025
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell
    env:
      QTRADES_POWERSHELL: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test requirements
        run: python -m pip install --no-input -r requirements-lock.txt
      - name: Verify owned runtime recovery and disposable approved updates
        run: |
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSEdition -ne 'Desktop') { throw 'Requires Windows PowerShell 5.1' }
          python -B -m pytest -q -p no:cacheprovider --tb=long --durations=20 `
            tests/test_model_runtime_task_ownership.py tests/test_simple_update.py `
            tests/test_scoped_tools.py::test_physical_journal_pressure_archives_before_64_mib `
            tests/test_scoped_tools.py::test_more_than_5000_receipts_reopen_failures_and_stable_request_ids

  postgres-integration:
    # Full portable suite with real password authentication, independent of
    # workstation disk availability. Keep both native selections and budgets.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: qtrades-source-ci-only
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test requirements
        run: |
          python -m pip install --no-input -r requirements-lock.txt
          # Owned PDF/background children need the installed application package;
          # pytest's parent-only source-path injection does not reach them.
          python -m pip install --no-input --no-deps -e .
      - name: Configure the disposable authenticated database
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import psycopg

          # These are disposable test-only credentials, never workstation data.
          dsn = "host=127.0.0.1 port=5432 dbname=postgres user=postgres password=qtrades-source-ci-only"
          target = Path(os.environ["RUNNER_TEMP"]) / "qtrades-source-pg.json"
          target.write_text(json.dumps({"dsn": dsn}), encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("QTRADES_TEST_DATABASE=" + str(target) + "\n")
          with psycopg.connect(dsn, autocommit=True) as connection:
              print("Disposable PostgreSQL:", connection.execute("SHOW server_version").fetchone()[0])
          PY
      - name: Run the complete PostgreSQL integration suite
        run: python -B -m pytest -q -p no:cacheprovider --tb=short

  browser-monitoring:
    # Exercise the compiled normal Accounts UI against an actual disposable API.
    # Only synthetic fixture receipts/screenshots leave this isolated job.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONPATH: src
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: qtrades-source-ci-only
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned test and browser requirements
        run: |
          python -m pip install --no-input -r requirements-lock.txt
          npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/browser-runtime" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/browser-runtime/node_modules/.bin/playwright" install --with-deps chromium
          npm --prefix apps/web run build
      - name: Configure disposable browser fixture
        run: |
          python - <<'PY'
          import json, os, uuid
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          (root / "browser-pg.json").write_text(json.dumps({"dsn":
              "host=127.0.0.1 port=5432 dbname=postgres user=postgres password=qtrades-source-ci-only"}))
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("QTRADES_BROWSER_QA_TOKEN=" + uuid.uuid4().hex + "\n")
              output.write("QTRADES_BROWSER_QA_OUTPUT=" + str(root / "browser-output") + "\n")
              output.write("NODE_PATH=" + str(root / "browser-runtime/node_modules") + "\n")
          PY
      - name: Verify audit success, failure, expiry, recovery and imbalance in Accounts
        run: |
          python -B tests/browser/financial_monitoring_server.py \
            --directory "$RUNNER_TEMP/browser-workspace" \
            --database-config "$RUNNER_TEMP/browser-pg.json" \
            --web-dist "$GITHUB_WORKSPACE/apps/web/dist" \
            > "$RUNNER_TEMP/browser-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:58960/api/health > /dev/null; then break; fi
            sleep 1
          done
          node tests/browser/financial_monitoring.cjs
      - name: Verify account history remains singular across status refreshes
        run: QTRADES_BROWSER_QA_OUTPUT="$RUNNER_TEMP/browser-output/account-history-refresh" node tests/browser/account_history_refresh.cjs
      - name: Verify native candle workspace and exact saved-study recovery
        run: |
          python -B tests/browser/candle_patterns_server.py \
            --directory "$RUNNER_TEMP/candle-browser-workspace" \
            --web-dist "$GITHUB_WORKSPACE/apps/web/dist" \
            > "$RUNNER_TEMP/candle-browser-server.log" 2>&1 &
          candle_pid=$!
          trap 'kill "$candle_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:58968/api/health > /dev/null; then break; fi
            sleep 1
          done
          QTRADES_BROWSER_QA_OUTPUT="$RUNNER_TEMP/browser-output/candle-patterns" \
            QTRADES_BROWSER_QA_ORIGIN=http://127.0.0.1:58968 \
            node tests/browser/candle_patterns.cjs
          wait "$candle_pid"
      - name: Verify native-year preparation, all levels, alerts and control recovery
        run: |
          python -B tests/browser/pattern_scanner_server.py \
            --directory "$RUNNER_TEMP/scanner-browser-workspace" \
            --web-dist "$GITHUB_WORKSPACE/apps/web/dist" \
            > "$RUNNER_TEMP/scanner-browser-server.log" 2>&1 &
          scanner_pid=$!
          trap 'kill "$scanner_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:58969/api/health > /dev/null; then break; fi
            sleep 1
          done
          QTRADES_BROWSER_QA_OUTPUT="$RUNNER_TEMP/browser-output/pattern-scanner" \
            QTRADES_BROWSER_QA_ORIGIN=http://127.0.0.1:58969 \
            node tests/browser/pattern_scanner.cjs
          wait "$scanner_pid"
      - name: Verify saved pattern charts, alert overlays and read-only history navigation
        run: |
          python -B tests/browser/pattern_scanner_server.py \
            --directory "$RUNNER_TEMP/scanner-chart-browser-workspace" \
            --web-dist "$GITHUB_WORKSPACE/apps/web/dist" --port 58970 --chart-check \
            > "$RUNNER_TEMP/scanner-chart-browser-server.log" 2>&1 &
          chart_pid=$!
          trap 'kill "$chart_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:58970/api/health > /dev/null; then break; fi
            sleep 1
          done
          QTRADES_BROWSER_QA_OUTPUT="$RUNNER_TEMP/browser-output/pattern-scanner-charts" \
            QTRADES_BROWSER_QA_ORIGIN=http://127.0.0.1:58970 \
            node tests/browser/pattern_scanner_charts.cjs
          wait "$chart_pid"
      - name: Verify original finding preparation and immutable comparison recovery
        run: |
          python -B tests/browser/pattern_comparison_server.py \
            --directory "$RUNNER_TEMP/comparison-browser-workspace" \
            --web-dist "$GITHUB_WORKSPACE/apps/web/dist" --port 58974 \
            > "$RUNNER_TEMP/comparison-browser-server.log" 2>&1 &
          comparison_pid=$!
          trap 'kill "$comparison_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:58974/api/health > /dev/null; then break; fi
            sleep 1
          done
          QTRADES_BROWSER_QA_OUTPUT="$RUNNER_TEMP/browser-output/pattern-comparisons" \
            QTRADES_BROWSER_QA_ORIGIN=http://127.0.0.1:58974 \
            node tests/browser/pattern_comparison.cjs
          wait "$comparison_pid"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthetic-financial-monitoring-browser
          path: ${{ runner.temp }}/browser-output
          if-no-files-found: ignore
          retention-days: 14

  persistent-research:
    # Keep the private-memory/reviewer cases independent of the existing eight-minute job.
    # New candle/scanner ownership cases run here; keep every original native
    # selector and both Windows lifecycle budgets intact.
    runs-on: windows-2025
    timeout-minutes: 8
    defaults:
      run:
        shell: powershell
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned source and verification requirements
        run: |
          python -m pip install --no-input -r requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Owned child interpreters need the application package, not pytest's
          # parent-only pythonpath injection. Match the declared installed setup.
          python -m pip install --no-input --no-deps -e .
      - name: Static checks and native reference/reviewer recovery
        run: |
          python -m ruff check src tests scripts/evaluate_admission_recovery.py scripts/answer_development_role.py scripts/observe_model_coexistence.py scripts/verify_performance_diagnostics.py scripts/verify_performance_coexistence.py scripts/preview_performance_diagnostic_ui.py scripts/preview_paper_pilot_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy --platform win32 src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m pytest -q -p no:cacheprovider --tb=long --durations=20 tests/test_persistent_research.py tests/test_knowledge_recovery.py tests/test_review_background.py tests/test_review_repairs.py tests/test_candle_patterns.py tests/test_candle_history.py tests/test_pattern_scanner.py tests/test_daily_pattern_analyzer.py tests/test_pattern_charts.py tests/test_live_candle_storage.py tests/test_pattern_comparisons.py tests/test_pattern_comparison_api.py
