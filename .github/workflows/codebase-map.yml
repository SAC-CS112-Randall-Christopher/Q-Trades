name: Code-to-product map

# Any PR can change a mapped owner or add a new inventory path. This lightweight
# workflow avoids path-filter gaps and leaves application job selectors intact.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check complete inventory, reviewed anchors and guide links
        run: python -B tools/codebase_map.py --check
      - name: Exercise map navigation and stale/missing-reference detection
        run: python -B -m unittest discover -s tests -p test_codebase_map.py
