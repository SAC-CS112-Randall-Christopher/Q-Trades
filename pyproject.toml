[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-research-platform"
version = "0.1.0"
description = "Local paper-only market research and learning experiment"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.140.3",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "uvicorn==0.51.0",
  "psycopg[binary]==3.3.4",
  "websockets==17.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.9", "mypy==2.3.1"]

[project.scripts]
trading = "trading.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
